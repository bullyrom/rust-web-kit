[package]
name = "rust-web-kit"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
actix-web = "=4.12.1"
sea-orm = { version = "=1.1.19", features = [
  "sqlx-postgres",
  "runtime-actix-native-tls",
  "macros",
] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
utoipa = { version = "=5.4.0", features = ["actix_extras"] }
url = "=2.5.7"
